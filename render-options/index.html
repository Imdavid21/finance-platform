<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f0eb" />
  <title>Intent Options</title>
  <style>
:root {
  --bg: #f3f0eb;
  --ink: #121214;
  --muted: #797773;
  --card: rgba(255, 255, 255, 0.86);
  --line: rgba(18,18,20,.08);
  --shadow: 0 28px 70px rgba(24, 20, 17, 0.10), 0 4px 14px rgba(24, 20, 17, 0.05);
  --yellow: #f6dda0;
  --lavender: #d9d0ff;
  --coral: #ffc7b9;
  --mint: #b8f2ce;
  --green: #28a268;
  --red: #ca4e56;
  --dark: #232328;
}

* { box-sizing: border-box; }
html, body { width: 100%; min-height: 100%; margin: 0; }
body {
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 50% 40%, rgba(255,255,255,.55), transparent 35%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button { color: inherit; }

.app-shell { min-height: 100vh; position: relative; overflow: hidden; }
.top-balance {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  height: 42px; border-radius: 24px; background: #29292f; color: #fff;
  display: flex; align-items: center; gap: 12px; padding: 5px 7px 5px 17px;
  box-shadow: 0 10px 28px rgba(0,0,0,.15); z-index: 30; font-weight: 700;
}
.top-balance .plus { color:#8f8f94; font-weight:500; }
.avatar {
  width: 31px; height: 31px; border-radius: 50%;
  background: linear-gradient(135deg,#96ecd0,#f4d583 48%,#d8c9ff);
  border: 1px solid rgba(255,255,255,.3); position: relative; overflow:hidden;
}
.avatar:after { content:""; position:absolute; inset:6px 7px 5px; border-radius:45% 45% 55% 55%; background:#61636d; opacity:.55; }

.builder-wrap {
  width: min(980px, calc(100vw - 44px));
  position: absolute; left: 50%; top: 51%; transform: translate(-50%, -50%);
}
.builder-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; max-width:900px; }
.meta-left { display:flex; align-items:center; gap:14px; }
.pill-dark { background:#232329; color:#fff; font-size:13px; font-weight:750; padding:8px 14px; border-radius:20px; }
.market-pill { display:flex; align-items:center; gap:7px; font-size:14px; font-weight:750; background:rgba(255,255,255,.7); padding:6px 10px; border-radius:18px; }
.market-pill .dot { width:7px; height:7px; border-radius:50%; background:#49d88a; box-shadow:0 0 0 4px rgba(73,216,138,.1); }
.chart-link { font-size:14px; color:#4f4d49; display:flex; gap:6px; align-items:center; background:transparent; border:0; cursor:pointer; }

.sentence {
  display:flex; flex-wrap:wrap; align-items:center; gap:10px 10px;
  font-size: clamp(38px, 4.25vw, 66px); line-height:1.03; font-weight:800; letter-spacing:-0.055em;
  max-width: 960px;
}
.word { white-space:nowrap; }
.chip {
  border:0; border-radius: 26px; padding: 8px 17px 10px; cursor:pointer;
  font-size: inherit; line-height: .95; font-weight: 800; letter-spacing:-0.055em;
  display:inline-flex; align-items:center; gap:9px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.015);
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
.chip:hover { transform: translateY(-1px); filter:saturate(1.04); }
.chip.active { box-shadow: inset 0 0 0 2px #1d1d20, 0 7px 20px rgba(0,0,0,.06); }
.chip .caret { font-size:.48em; letter-spacing:0; margin-left:2px; }
.chip .delta { font-size:.34em; letter-spacing:-.02em; background:rgba(255,255,255,.42); border-radius:16px; padding:5px 7px; font-weight:800; }
.chip-profit { background:var(--yellow); }
.chip-asset, .chip-expiry { background:var(--lavender); }
.chip-verb { background:var(--coral); }
.chip-target { background:var(--mint); }

.derived { margin-top:18px; display:flex; align-items:center; gap:28px; font-size:15px; color:#4e4b47; }
.cost-pill { min-width:160px; background:rgba(255,255,255,.78); border-radius:28px; padding:8px 16px 8px 18px; display:flex; align-items:center; gap:10px; }
.cost-pill .label { font-size:14px; color:#68645f; }
.cost-pill strong { font-size:28px; letter-spacing:-.04em; color:#161618; }
.probability strong { color:#19191b; margin-right:4px; }

.popover {
  position:absolute; z-index:20; margin-top:12px; width:350px; padding:16px;
  background:rgba(255,255,255,.92); border:1px solid rgba(0,0,0,.04); border-radius:28px;
  box-shadow:var(--shadow); backdrop-filter: blur(18px); animation:pop .18s ease-out;
}
@keyframes pop { from { opacity:0; transform:translateY(-5px) scale(.985);} to {opacity:1; transform:none;} }
.popover.profit { left: 290px; top: 145px; }
.popover.asset { left: 520px; top: 145px; }
.popover.target { left: 0px; top: 215px; }
.popover.expiry { left: 320px; top: 215px; }
.popover-title { font-size:13px; color:#77726d; margin:2px 3px 10px; }
.big-input-wrap { background:#f2f0ec; border-radius:21px; padding:12px 16px; display:flex; align-items:center; gap:8px; }
.big-input-wrap .currency { font-size:28px; color:#6a6762; }
.big-input { border:0; outline:0; background:transparent; width:100%; font-size:34px; font-weight:800; letter-spacing:-.04em; color:#171719; }
.subtext { font-size:12px; color:#86817b; }
.slider-row { margin-top:12px; background:#efede8; border-radius:28px; padding:8px 10px; }
input[type="range"] { width:100%; accent-color:#90ecc0; cursor:pointer; }
.range-labels { display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:#6f6a64; }
.popover-footer { margin-top:12px; display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#65615c; }
.popover-footer strong { color:#19191b; }

.asset-list { display:flex; flex-direction:column; gap:4px; }
.asset-row { width:100%; border:0; background:transparent; border-radius:18px; padding:11px 13px; display:grid; grid-template-columns: 56px 1fr 58px 78px; gap:8px; align-items:center; cursor:pointer; text-align:left; }
.asset-row:hover, .asset-row.selected { background:#28282e; color:#fff; }
.asset-row .symbol { font-weight:800; }
.asset-row .price { font-size:12px; color:#77726d; }
.asset-row.selected .price { color:#bcbcc1; }
.asset-row .change { font-size:12px; font-weight:800; text-align:right; }
.asset-row .change.up { color:#35a86e; } .asset-row .change.down { color:#ce5b63; }
.spark { width:68px; height:24px; }

.expiry-row { border:0; width:100%; background:transparent; border-radius:16px; padding:12px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; text-align:left; }
.expiry-row:hover, .expiry-row.selected { background:#26262b; color:#fff; }
.expiry-main { display:flex; flex-direction:column; gap:3px; }
.expiry-date { font-weight:800; }
.expiry-meta { font-size:11px; color:#8a8580; }
.expiry-row.selected .expiry-meta { color:#bdbdc2; }
.expiry-prob { font-weight:800; font-size:13px; }

.bottom-dock {
  position: fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:25;
  height:63px; display:flex; align-items:center; gap:8px; padding:7px 8px;
  border-radius:34px; background:rgba(255,255,255,.86); box-shadow:0 15px 40px rgba(0,0,0,.12); backdrop-filter:blur(15px);
}
.dock-icon { width:45px; height:45px; border:0; background:transparent; border-radius:50%; cursor:pointer; font-size:20px; display:grid; place-items:center; }
.dock-icon.active { background:#24242a; color:#fff; }
.dock-divider { width:1px; height:25px; background:#ddd8d1; margin:0 3px; }
.buy-btn {
  border:0; background:#232329; color:#fff; border-radius:27px; height:47px; min-width:177px;
  padding:0 8px 0 20px; display:flex; align-items:center; justify-content:space-between; gap:13px; cursor:pointer; font-weight:750;
}
.buy-btn:hover { background:#19191d; }
.buy-btn .buy-price { font-size:17px; }
.buy-btn .arrow { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:#33333a; }

.review-wrap { width:min(1000px, calc(100vw - 42px)); margin:86px auto 110px; display:grid; grid-template-columns:1.05fr 1fr; gap:14px; }
.review-card { background:var(--card); border-radius:30px; box-shadow:0 4px 24px rgba(0,0,0,.025); padding:24px; min-height:660px; backdrop-filter:blur(18px); }
.review-head { display:flex; justify-content:space-between; align-items:flex-start; }
.eyebrow { color:#66625e; font-size:14px; margin-bottom:16px; }
.edit-btn { border:0; background:#efede9; border-radius:18px; padding:8px 13px; font-weight:700; cursor:pointer; }
.review-title { font-size:32px; line-height:1.08; letter-spacing:-.045em; margin:0 0 24px; max-width:520px; }
.inline-profit, .inline-target, .inline-expiry { border-radius:10px; padding:0 7px 2px; }
.inline-profit { background:var(--yellow); }.inline-target{background:var(--mint)}.inline-expiry{background:var(--lavender)}
.scenarios { border:4px solid #ebe9e5; border-radius:18px; overflow:hidden; background:#fff; }
.scenario { min-height:50px; padding:10px 12px; display:grid; grid-template-columns:32px 1fr auto; align-items:center; gap:10px; border-bottom:1px solid #ece9e4; }
.scenario:last-child{border-bottom:0}.scenario-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:900}.scenario-icon.up{background:#bff2d2}.scenario-icon.flat{background:#eee}.scenario-icon.down{background:#ffd0cc}.scenario-label{font-weight:700;font-size:14px}.scenario-pnl{font-weight:850}.scenario-pnl.up{color:var(--green)}.scenario-pnl.down{color:var(--red)}
.chart-caption { margin:18px 0 10px; font-size:12px; color:#66625e; }
.payoff-chart { width:100%; height:190px; position:relative; }
.payoff-bars { height:145px; display:flex; align-items:flex-end; gap:4px; border-bottom:2px solid #19191b; padding:0 2px; }
.bar-wrap { flex:1; height:100%; display:flex; align-items:flex-end; position:relative; }
.bar { width:100%; border-radius:7px 7px 0 0; transition:height .25s ease; }
.bar.positive{background:#57ce8b}.bar.negative{background:#ef908b; border-radius:0 0 7px 7px; position:absolute; top:100%; transform:translateY(2px)}
.chart-axis { display:flex; justify-content:space-between; font-size:11px; color:#5e5a56; margin-top:50px; }
.contract-toggle { margin-top:20px; border-top:1px solid #ebe8e2; padding-top:16px; display:flex; justify-content:space-between; align-items:center; font-weight:700; cursor:pointer; }
.contract-details { margin-top:12px; background:#f7f5f1; border-radius:14px; padding:12px 14px; display:grid; gap:10px; font-size:13px; }
.leg { display:flex; justify-content:space-between; gap:12px; }
.leg span:last-child { font-weight:750; }

.quote-card { min-height:0; padding:16px 22px; }
.quote-row { min-height:60px; display:flex; align-items:center; justify-content:space-between; gap:20px; border-bottom:1px solid #e8e5e0; font-size:14px; }
.quote-row:last-child{border-bottom:0}.quote-label{color:#706c67}.quote-value{font-weight:780;text-align:right}.quote-value.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}.quote-skeleton{width:86px;height:12px;border-radius:8px;background:linear-gradient(90deg,#e9e7e1,#f5f3ef,#e9e7e1);background-size:200% 100%;animation:shimmer 1.2s linear infinite}@keyframes shimmer{to{background-position:-200% 0}}
.risk-row { margin:16px 10px 14px; display:flex; gap:12px; align-items:flex-start; font-size:13px; line-height:1.35; }
.checkbox { width:24px;height:24px;border:2px solid #1d1d20;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;background:#fff}.checkbox.checked{background:#24242a;color:#fff}.confirm-btn{width:100%;height:58px;border:0;border-radius:29px;background:#25252b;color:#fff;font-weight:800;font-size:16px;cursor:pointer;transition:.2s ease}.confirm-btn:disabled{background:#dad6cf;color:#736f69;cursor:not-allowed}.confirm-btn.success{background:#1d7c50}
.quote-ttl { text-align:center; margin-top:8px; font-size:11px; color:#77726d; }

.toast { position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:100; padding:11px 16px; border-radius:18px; background:#24242a; color:#fff; font-size:13px; box-shadow:0 12px 35px rgba(0,0,0,.16); animation:pop .2s ease; }
.dim { opacity:.45; }

@media (max-width: 900px) {
  .builder-wrap { top:47%; }
  .sentence { font-size:clamp(34px,7vw,54px); }
  .popover.profit,.popover.asset,.popover.target,.popover.expiry { left:0; top:100%; }
  .review-wrap { grid-template-columns:1fr; margin-top:80px; }
  .review-card { min-height:0; }
}
@media (max-width: 620px) {
  .builder-wrap { width:calc(100vw - 28px); }
  .sentence { gap:8px; font-size:38px; }
  .chip { padding:7px 12px 9px; border-radius:20px; }
  .derived { flex-wrap:wrap; gap:12px; }
  .popover { width:min(350px, calc(100vw - 28px)); }
  .dock-icon:nth-of-type(2), .dock-icon:nth-of-type(3) { display:none; }
  .review-wrap { width:calc(100vw - 20px); }
  .review-card { padding:18px; border-radius:22px; }
  .review-title { font-size:27px; }
}

</style>
</head>
<body>
  <div id="app"></div>
  <script>
(() => {
  const $ = (s, el=document) => el.querySelector(s);
  const $$ = (s, el=document) => [...el.querySelectorAll(s)];
  const fmt = (n, d=0) => Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  const clamp = (n,a,b)=>Math.min(b,Math.max(a,n));
  const roundTo = (n, step)=>Math.round(n/step)*step;

  const assets = {
    ETH: { price:2703, change:1.3, vol:.62, step:50, spark:[18,15,19,17,24,20,23,25,22,27,24,28] },
    ADA: { price:.2709, change:12.1, vol:.82, step:.01, spark:[12,11,13,12,17,15,16,16,19,23,22,26] },
    BTC: { price:85841, change:3.3, vol:.49, step:1000, spark:[14,13,18,17,22,18,19,23,21,25,24,26] },
    CC: { price:.1243, change:-.7, vol:.95, step:.01, spark:[24,22,19,21,17,18,16,18,20,19,22,23] },
    HYPE: { price:92, change:7.9, vol:.76, step:5, spark:[13,14,13,18,16,20,19,22,21,23,25,27] },
    LIT: { price:3.88, change:-12.8, vol:1.08, step:.25, spark:[26,23,19,20,16,14,12,15,13,12,11,13] }
  };

  const expiries = [
    {date:'Nov 27', iso:'2026-11-27', dte:51, cadence:'Monthly'},
    {date:'Dec 25', iso:'2026-12-25', dte:79, cadence:'Monthly'},
    {date:'Jan 29', iso:'2027-01-29', dte:114, cadence:'Monthly'},
    {date:'Mar 26', iso:'2027-03-26', dte:170, cadence:'Quarterly'}
  ];

  const state = {
    view:'builder', open:null, profit:3000, asset:'ETH', target:3100, expiry:expiries[0],
    risk:false, quoted:false, quoteLoading:false, contractsOpen:false, executing:false, success:false,
    quoteTTL:22, toast:null
  };

  function normCdf(x){
    const t = 1/(1+.2316419*Math.abs(x));
    const d = .3989423*Math.exp(-x*x/2);
    let p = d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
    if(x>0) p=1-p;
    return p;
  }

  function probability(asset, target, dte){
    const a=assets[asset], T=Math.max(dte,1)/365;
    const z=(Math.log(target/a.price)+.5*a.vol*a.vol*T)/(a.vol*Math.sqrt(T));
    return clamp(1-normCdf(z),.03,.91);
  }

  function metrics(){
    const a=assets[state.asset];
    const p=probability(state.asset,state.target,state.expiry.dte);
    const pct=(state.target/a.price-1)*100;
    const debitRatio=clamp(.19+p*1.32+Math.sqrt(state.expiry.dte/365)*.08,.27,.73);
    const debit=Math.round(state.profit*debitRatio);
    const maxProfit=Math.round(state.profit*(1.018 + (p-.2)*.04));
    const width=Math.max(a.step*2, roundTo(state.target*.12,a.step));
    const debitPer=Math.max(width*.18, width*debitRatio*.72);
    const profitPer=Math.max(width-debitPer,a.step*.35);
    const qty=Math.max(.01,maxProfit/profitPer);
    const longStrike=roundTo(state.target-width,a.step);
    const shortStrike=roundTo(state.target,a.step);
    const breakeven=longStrike+debitPer;
    const fee=Math.max(2.5, debit*.0025);
    const feeCap=Math.ceil(fee*4.8);
    const marginAfter=Math.round(1100+debit*.82);
    return {p,pct,debit,maxProfit,maxLoss:debit,qty,longStrike,shortStrike,breakeven,fee,feeCap,marginAfter,width,debitPer};
  }

  function sparkSvg(vals, down=false){
    const min=Math.min(...vals), max=Math.max(...vals), w=68,h=24;
    const pts=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-3-((v-min)/(max-min||1))*(h-7)}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="${down?'#c64d5b':'#2d9962'}" stroke-width="1.8" points="${pts}"/></svg>`;
  }

  function chip(label, cls, key, extra=''){
    return `<button class="chip ${cls} ${state.open===key?'active':''}" data-open="${key}">${label}${extra}<span class="caret">⌄</span></button>`;
  }

  function builder(){
    const m=metrics(), a=assets[state.asset];
    return `
      <main class="builder-wrap">
        <div class="builder-meta">
          <div class="meta-left"><span class="pill-dark">Call spread</span><span class="market-pill"><i class="dot"></i>${state.asset} ${a.price<10?'$'+fmt(a.price, a.price<1?4:2):'$'+fmt(a.price)}</span></div>
          <button class="chart-link" data-toast="Payoff chart opens in review">⌁ <span>Chart</span></button>
        </div>
        <div class="sentence">
          <span class="word">I want to make</span>
          ${chip('$'+fmt(state.profit),'chip-profit','profit')}
          <span class="word">if</span>
          ${chip(state.asset,'chip-asset','asset')}
          <button class="chip chip-verb" data-toast="Bullish MVP uses an expiry-settlement outcome">hits <span style="font-size:.42em">↗</span></button>
          ${chip('$'+fmt(state.target, state.target<10?2:0),'chip-target','target',`<span class="delta">${m.pct>=0?'↑':'↓'}${Math.abs(m.pct).toFixed(0)}%</span>`)}
          <span class="word">by</span>
          ${chip(state.expiry.date,'chip-expiry','expiry')}
        </div>
        <div class="derived"><div class="cost-pill"><span class="label">It costs</span><strong>$${fmt(m.debit)}</strong></div><div class="probability"><strong>${Math.round(m.p*100)}%</strong> chance it happens</div></div>
        ${popover()}
      </main>`;
  }

  function popover(){
    const m=metrics(), a=assets[state.asset];
    if(state.open==='profit') return `<div class="popover profit">
      <div class="popover-title">How much do you want to make?</div>
      <div class="big-input-wrap"><span class="currency">$</span><input class="big-input" id="profitInput" type="number" min="100" max="25000" step="100" value="${state.profit}"><span class="subtext">type or drag</span></div>
      <div class="slider-row"><input id="profitRange" type="range" min="100" max="10000" step="100" value="${state.profit}"></div>
      <div class="range-labels"><span>$100</span><span>$10,000</span></div>
      <div class="popover-footer"><span>Estimated cost</span><strong>$${fmt(m.debit)}</strong></div>
    </div>`;
    if(state.open==='asset') return `<div class="popover asset"><div class="popover-title">Choose an options token</div><div class="asset-list">${Object.entries(assets).map(([sym,x])=>`<button class="asset-row ${sym===state.asset?'selected':''}" data-asset="${sym}"><span class="symbol">${sym}</span><span class="price">$${fmt(x.price,x.price<1?4:x.price<10?2:0)}</span><span class="change ${x.change>=0?'up':'down'}">${x.change>=0?'+':''}${x.change}%</span>${sparkSvg(x.spark,x.change<0)}</button>`).join('')}</div></div>`;
    if(state.open==='target') {
      const min=roundTo(a.price*1.01,a.step), max=roundTo(a.price*2,a.step);
      return `<div class="popover target"><div class="popover-title">${state.asset} reference price $${fmt(a.price,a.price<10?2:0)}</div>
      <div class="big-input-wrap"><span class="currency">$</span><input class="big-input" id="targetInput" type="number" min="${min}" max="${max}" step="${a.step}" value="${state.target}"><span class="subtext">type or drag</span></div>
      <div class="slider-row"><input id="targetRange" type="range" min="${min}" max="${max}" step="${a.step}" value="${state.target}"></div>
      <div class="range-labels"><span>$${fmt(min,a.price<10?2:0)}</span><strong>${Math.round(m.p*100)}% chance · ${m.pct>=0?'+':''}${m.pct.toFixed(0)}% from now</strong><span>$${fmt(max,a.price<10?2:0)}</span></div></div>`;
    }
    if(state.open==='expiry') return `<div class="popover expiry"><div class="popover-title">Choose expiry</div>${expiries.map(e=>{const p=probability(state.asset,state.target,e.dte);return `<button class="expiry-row ${e.iso===state.expiry.iso?'selected':''}" data-expiry="${e.iso}"><span class="expiry-main"><span class="expiry-date">${e.date}</span><span class="expiry-meta">${e.dte} days · ${e.cadence}</span></span><span class="expiry-prob">${Math.round(p*100)}%</span></button>`}).join('')}</div>`;
    return '';
  }

  function payoffBars(){
    const m=metrics(), a=assets[state.asset];
    const low=a.price*.82, high=Math.max(state.target*1.17,a.price*1.28);
    const points=16;
    const vals=[];
    for(let i=0;i<points;i++){
      const s=low+(high-low)*i/(points-1);
      const payoff=Math.min(Math.max(s-m.longStrike,0),m.shortStrike-m.longStrike)*m.qty-m.debit;
      vals.push({s,payoff});
    }
    const maxAbs=Math.max(...vals.map(v=>Math.abs(v.payoff)),1);
    const bars=vals.map(v=>{
      const h=Math.max(4,Math.abs(v.payoff)/maxAbs*58);
      return `<div class="bar-wrap">${v.payoff>=0?`<div class="bar positive" style="height:${h}px"></div>`:`<div class="bar negative" style="height:${h}px"></div>`}</div>`
    }).join('');
    return `<div class="payoff-chart"><div class="payoff-bars">${bars}</div><div class="chart-axis"><span>$${fmt(low,0)}</span><span>$${fmt(a.price,0)}</span><span>$${fmt(state.target,0)}</span><span>$${fmt(high,0)}</span></div></div>`;
  }

  function review(){
    const m=metrics(), a=assets[state.asset];
    const halfway=Math.round((a.price+state.target)/2);
    const halfPay=Math.round(clamp((halfway-m.breakeven)/(state.target-m.breakeven),0,1)*m.maxProfit*.55);
    const dateFull=new Date(state.expiry.iso+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    return `<main class="review-wrap">
      <section class="review-card">
        <div class="review-head"><div><div class="eyebrow">Your position</div><h1 class="review-title">Make <span class="inline-profit">$${fmt(state.profit)}</span> if ${state.asset} ends above <span class="inline-target">$${fmt(state.target,state.target<10?2:0)}</span> by <span class="inline-expiry">${state.expiry.date}</span></h1></div><button class="edit-btn" data-edit>Edit</button></div>
        <div class="scenarios">
          <div class="scenario"><span class="scenario-icon up">↗</span><span class="scenario-label">${state.asset} reaches $${fmt(state.target,state.target<10?2:0)}</span><span class="scenario-pnl up">+$${fmt(m.maxProfit)}</span></div>
          <div class="scenario"><span class="scenario-icon flat">→</span><span class="scenario-label">Gets halfway, $${fmt(halfway,0)}</span><span class="scenario-pnl up">+$${fmt(halfPay)}</span></div>
          <div class="scenario"><span class="scenario-icon down">↘</span><span class="scenario-label">Stays under $${fmt(Math.round(a.price),0)}</span><span class="scenario-pnl down">−$${fmt(m.maxLoss)}</span></div>
        </div>
        <div class="chart-caption">Profit or loss by ${state.asset} price on ${state.expiry.date} · hover concept represented as scenario bars</div>
        ${payoffBars()}
        <div class="contract-toggle" data-contracts><span>Contracts</span><span>${state.contractsOpen?'−':'+'}</span></div>
        ${state.contractsOpen?`<div class="contract-details"><div class="leg"><span>Buy ${fmt(m.qty,2)} ${state.asset} call</span><span>$${fmt(m.longStrike,state.target<10?2:0)} strike</span></div><div class="leg"><span>Sell ${fmt(m.qty,2)} ${state.asset} call</span><span>$${fmt(m.shortStrike,state.target<10?2:0)} strike</span></div><div class="leg"><span>Break-even at expiry</span><span>$${fmt(m.breakeven,state.target<10?2:0)}</span></div></div>`:''}
      </section>
      <section>
        <div class="review-card quote-card">${quoteRows(m,dateFull)}</div>
        <div class="risk-row"><div class="checkbox ${state.risk?'checked':''}" data-risk>${state.risk?'✓':''}</div><div>I understand this testnet spread settles in cash and is subject to venue margin and liquidation rules.</div></div>
        <button class="confirm-btn ${state.success?'success':''}" data-confirm ${(!state.quoted||!state.risk||state.executing||state.success)?'disabled':''}>${state.success?'Trade submitted':state.executing?'Submitting…':state.quoteLoading?'Requesting quote…':state.quoted?'Confirm payment':'Requesting quote…'}</button>
        ${state.quoted&&!state.success?`<div class="quote-ttl">Quote refreshes in ${state.quoteTTL}s</div>`:''}
      </section>
    </main>`;
  }

  function quoteRows(m,dateFull){
    const skeleton=()=>`<span class="quote-skeleton"></span>`;
    const val=(x)=>state.quoteLoading?skeleton():x;
    return `
      <div class="quote-row"><span class="quote-label">Wallet</span><span class="quote-value mono">0x95B0…8Da8</span></div>
      <div class="quote-row"><span class="quote-label">Subaccount</span><span class="quote-value">86990</span></div>
      <div class="quote-row"><span class="quote-label">Contracts</span><span class="quote-value">${val(fmt(m.qty,2)+' / leg')}</span></div>
      <div class="quote-row"><span class="quote-label">Maximum debit</span><span class="quote-value">${val('$'+fmt(m.debit))}</span></div>
      <div class="quote-row"><span class="quote-label">Maximum profit</span><span class="quote-value">${val('$'+fmt(m.maxProfit))}</span></div>
      <div class="quote-row"><span class="quote-label">Maximum loss</span><span class="quote-value">${val('$'+fmt(m.maxLoss))}</span></div>
      <div class="quote-row"><span class="quote-label">Fee cap</span><span class="quote-value">${val('$'+fmt(m.feeCap))}</span></div>
      <div class="quote-row"><span class="quote-label">Platform fee</span><span class="quote-value">${val('$'+m.fee.toFixed(2)+' · 0.25%')}</span></div>
      <div class="quote-row"><span class="quote-label">Expires</span><span class="quote-value">${val(dateFull)}</span></div>
      <div class="quote-row"><span class="quote-label">Initial margin after</span><span class="quote-value">${val('$'+fmt(m.marginAfter))}</span></div>
      <div class="quote-row"><span class="quote-label">Settlement</span><span class="quote-value">Cash settled · testnet rules</span></div>`;
  }

  function dock(){
    const m=metrics();
    return `<nav class="bottom-dock"><button class="dock-icon active" title="Builder">↗</button><button class="dock-icon" data-toast="Portfolio mock">♙</button><button class="dock-icon" data-toast="Positions mock">◯</button><button class="dock-icon" data-toast="Analytics mock">▥</button>${state.view==='builder'?`<div class="dock-divider"></div><button class="buy-btn" data-buy><span>Buy for&nbsp; <span class="buy-price">$${fmt(m.debit)}</span></span><span class="arrow">→</span></button>`:''}</nav>`;
  }

  function render(){
    const app=$('#app');
    app.innerHTML=`<div class="app-shell"><div class="top-balance"><span>$18,110</span><span class="plus">+</span><span class="avatar"></span></div>${state.view==='builder'?builder():review()}${dock()}${state.toast?`<div class="toast">${state.toast}</div>`:''}</div>`;
    bind();
  }

  function updateTargetForAsset(sym){
    const a=assets[sym];
    state.asset=sym;
    state.target=roundTo(a.price*1.145,a.step);
  }

  function showToast(msg){ state.toast=msg; render(); setTimeout(()=>{state.toast=null;render();},1400); }

  function requestQuote(){
    state.quoteLoading=true; state.quoted=false; state.risk=false; state.success=false; state.quoteTTL=22; render();
    setTimeout(()=>{state.quoteLoading=false;state.quoted=true;render(); startTTL();},900);
  }

  let ttlTimer=null;
  function startTTL(){
    clearInterval(ttlTimer);
    ttlTimer=setInterval(()=>{
      if(state.view!=='review'||!state.quoted||state.success){clearInterval(ttlTimer);return;}
      state.quoteTTL--;
      if(state.quoteTTL<=0){ state.quoted=false; state.risk=false; clearInterval(ttlTimer); requestQuote(); return; }
      render();
    },1000);
  }

  function bind(){
    $$('[data-open]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); const k=b.dataset.open; state.open=state.open===k?null:k; render();});
    $$('[data-toast]').forEach(b=>b.onclick=()=>showToast(b.dataset.toast));
    $$('[data-asset]').forEach(b=>b.onclick=()=>{updateTargetForAsset(b.dataset.asset);state.open=null;render();});
    $$('[data-expiry]').forEach(b=>b.onclick=()=>{state.expiry=expiries.find(e=>e.iso===b.dataset.expiry);state.open=null;render();});
    const pi=$('#profitInput'), pr=$('#profitRange');
    if(pi) pi.oninput=()=>{state.profit=clamp(+pi.value||100,100,25000); render();};
    if(pr) pr.oninput=()=>{state.profit=+pr.value; render();};
    const ti=$('#targetInput'), tr=$('#targetRange');
    if(ti) ti.oninput=()=>{state.target=+ti.value;render();};
    if(tr) tr.oninput=()=>{state.target=+tr.value;render();};
    const buy=$('[data-buy]'); if(buy) buy.onclick=()=>{state.view='review';state.open=null;render();requestQuote();};
    const edit=$('[data-edit]'); if(edit) edit.onclick=()=>{state.view='builder';state.quoteLoading=false;state.quoted=false;state.risk=false;clearInterval(ttlTimer);render();};
    const risk=$('[data-risk]'); if(risk) risk.onclick=()=>{if(state.quoted){state.risk=!state.risk;render();}};
    const contracts=$('[data-contracts]'); if(contracts) contracts.onclick=()=>{state.contractsOpen=!state.contractsOpen;render();};
    const confirm=$('[data-confirm]'); if(confirm) confirm.onclick=()=>{
      if(!state.quoted||!state.risk||state.executing)return;
      state.executing=true;render();setTimeout(()=>{state.executing=false;state.success=true;clearInterval(ttlTimer);render();showToast('Execution ID: EXE-7D91A4');},1100);
    };
  }

  document.addEventListener('click',e=>{
    if(state.open && !e.target.closest('.popover') && !e.target.closest('[data-open]')) { state.open=null; render(); }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&state.open){state.open=null;render();}
  });

  render();
})();

</script>
</body>
</html>
